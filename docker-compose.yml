version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: task-backend
    ports:
      - "5000:5000"         
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend:/app       
      - /app/node_modules   
    networks:
      - task-network

  # Frontend
  frontend:
    build: ./frontend
    container_name: task-frontend
    ports:
      - "3000:80"            
    depends_on:
      - backend
    networks:
      - task-network


networks:
  task-network:
    driver: bridge